[tool.poetry]
name = "lidglm"
version = "0.1.0"
description = "A compromise between generalized linear models and unconstrained neural networks."
authors = ["Tom Splittgerber"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
numpy = "1.26.4"
matplotlib = "^3.9.2"
scikit-learn = "1.5.2"
tqdm = "^4.66.5"
statsmodels = "^0.14.2"
torch = {version = "2.3.1", source = "pytorch-gpu"}
torchaudio = {version = "2.3.1", source = "pytorch-gpu"}
torchvision = {version = "0.18.1", source = "pytorch-gpu"}
ray = {extras = ["data", "serve", "train", "tune"], version = "2.37.0"}
seaborn = "^0.13.2"
normflows = "^1.7.3"
ucimlrepo = "^0.0.7"
cvxopt = "^1.3.3"

[[tool.poetry.source]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
